<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Chatbot</title>
  <link rel="stylesheet" href="/static/style.css?v=20260807-copy-btn">
</head>
<body>
  <div class="app-layout">

    <!-- Mobile sidebar toggle -->
    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      aria-label="Toggle sidebar"
      aria-expanded="false"
    >&#9776;</button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Static Chatbot</h2>
        <button
          class="new-chat-button"
          id="newChatButton"
          type="button"
        >+ New Chat</button>
      </div>
      <div class="session-list" id="sessionList">
        <!-- Sessions rendered by app.js -->
      </div>
    </aside>

    <!-- Chat area -->
    <main class="chat-area" id="chatArea">
      <div class="chat-session-header" id="sessionHeader">
        <!-- Current session title rendered by app.js -->
      </div>

      <div
        class="chat-messages"
        id="messages"
        role="log"
        aria-label="Chat messages"
      >
        <!-- Messages or welcome / empty state -->
      </div>

      <div
        class="chat-status"
        id="status"
        aria-live="polite"
      ></div>

      <div class="chat-input-area">
        <label for="messageInput" class="sr-only">Message</label>
        <textarea
          id="messageInput"
          class="chat-input"
          placeholder="Type a message..."
          rows="1"
          maxlength="4000"
          autofocus
        ></textarea>
        <button
          id="sendButton"
          class="send-button"
          type="button"
        >Send</button>
      </div>
    </main>

  </div>

  <script src="/static/network-recovery.js" defer></script>
  <script src="/static/clipboard.js?v=20260807-copy-btn" defer></script>
  <script src="/static/copy-controller.js?v=20260807-copy-btn" defer></script>
  <script src="/static/app.js?v=20260807-copy-btn" defer></script>
</body>
</html>
