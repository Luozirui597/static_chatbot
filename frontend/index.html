<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Chatbot</title>
  <link rel="stylesheet" href="/static/style.css?v=20260914-history-review3">
</head>
<body>
  <div class="app-layout">

    <!-- Mobile sidebar toggle -->
    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      aria-label="Toggle sidebar"
      aria-expanded="false"
    >&#9776;</button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Static Chatbot</h2>
        <button
          class="new-chat-button"
          id="newChatButton"
          type="button"
        >+ New Chat</button>

        <div class="profile-selector">
          <label for="profileSelect">Model for new chats</label>
          <select id="profileSelect"></select>
          <div
            class="profile-selector-status"
            id="profileSelectorStatus"
            aria-live="polite"
          ></div>
        </div>
      </div>

      <div class="session-list" id="sessionList">
        <!-- Sessions rendered by app.js -->
      </div>
      <div
        class="session-list-status"
        id="sessionListStatus"
        role="status"
        aria-live="polite"
        hidden
      ></div>
    </aside>

    <!-- Chat area -->
    <main class="chat-area" id="chatArea">
      <div class="chat-session-header" id="sessionHeader">
        <span class="session-title" id="sessionTitle"></span>
        <span class="session-model-badge" id="sessionModelBadge" hidden></span>
        <span class="interaction-mode-badge" id="interactionModeBadge" hidden></span>
      </div>

      <div
        class="session-compatibility-notice"
        id="sessionCompatibilityNotice"
        role="status"
        aria-live="polite"
        tabindex="-1"
        hidden
      ></div>

      <div id="interactionModeBar" class="interaction-mode-bar" hidden>
        <label for="interactionModeSelect">Interaction mode for this chat</label>
        <div class="interaction-mode-row">
          <select id="interactionModeSelect"></select>
          <button id="applyInteractionModeBtn" type="button">Apply</button>
        </div>
        <div
          class="interaction-mode-status"
          id="interactionModeStatus"
          role="status"
          aria-live="polite"
        ></div>
      </div>

      <div id="currentProfileBar" class="current-profile-bar" hidden>
        <label for="currentProfileSelect">Model for this chat</label>
        <div class="current-profile-row">
          <select id="currentProfileSelect"></select>
          <button id="applyProfileBtn" type="button">Apply</button>
        </div>
        <div
          class="current-profile-status"
          id="currentProfileStatus"
          role="status"
          aria-live="polite"
        ></div>
      </div>

      <section
        id="historyReviewPanel"
        class="history-review-panel"
        aria-labelledby="historyReviewTitle"
        hidden
      >
        <div class="history-review-header">
          <h2 id="historyReviewTitle">History review</h2>
          <span
            id="historyReviewStatusBadge"
            class="history-review-status-badge"
          ></span>
          <button
            id="historyReviewToggleBtn"
            type="button"
            aria-expanded="true"
            aria-controls="historyReviewBody"
          >Collapse</button>
        </div>

        <div id="historyReviewBody" class="history-review-body">
          <div
            id="historyReviewLive"
            class="history-review-live"
            role="status"
            aria-live="polite"
          ></div>

          <div id="historyReviewProposal" hidden>
            <p id="historyReviewProposalText"></p>
            <div class="history-review-actions">
              <button id="historyReviewStartBtn" type="button">
                Review previous teaching
              </button>
              <button id="historyReviewDismissBtn" type="button">
                Not now
              </button>
            </div>
          </div>

          <div id="historyReviewDetail" hidden>
            <div id="historyReviewSelector" hidden>
              <label for="historyReviewSelect">Review</label>
              <select id="historyReviewSelect"></select>
            </div>

            <p id="historyReviewSummary"></p>
            <p id="historyReviewCoverage"></p>

            <ul
              id="historyReviewFindings"
              class="history-review-findings"
            ></ul>

            <p
              id="historyReviewError"
              class="history-review-error"
              role="status"
              hidden
            ></p>

            <div class="history-review-actions">
              <button id="historyReviewRecheckBtn" type="button">
                Recheck
              </button>
              <button id="historyReviewContinueBtn" type="button" hidden>
                Continue review
              </button>
            </div>
          </div>
        </div>
      </section>

      <div
        class="chat-messages"
        id="messages"
        role="log"
        aria-label="Chat messages"
      >
        <!-- Messages or welcome / empty state -->
      </div>

      <div
        class="chat-status"
        id="status"
        aria-live="polite"
      ></div>

      <div class="chat-input-area">
        <label for="messageInput" class="sr-only">Message</label>
        <textarea
          id="messageInput"
          class="chat-input"
          placeholder="Type a message..."
          rows="1"
          maxlength="4000"
          autofocus
        ></textarea>
        <button
          id="sendButton"
          class="send-button"
          type="button"
        >Send</button>
      </div>
    </main>

  </div>

  <dialog
    id="profileSwitchDialog"
    aria-labelledby="psd-title"
    aria-describedby="psd-body"
  >
    <h2 id="psd-title">Send chat history to a remote API service?</h2>
    <p id="psd-body"></p>
    <div class="dialog-actions">
      <button id="psd-cancel" type="button" data-variant="secondary">Cancel</button>
      <button id="psd-continue" type="button" data-variant="primary">Continue</button>
    </div>
  </dialog>

  <dialog
    id="historyReviewStartDialog"
    aria-labelledby="hrs-title"
    aria-describedby="hrs-body"
  >
    <h2 id="hrs-title">Start a history review?</h2>
    <p id="hrs-body"></p>
    <div class="dialog-actions">
      <button id="hrs-cancel" type="button" data-variant="secondary">Cancel</button>
      <button id="hrs-start" type="button" data-variant="primary">Start review</button>
    </div>
  </dialog>

  <dialog
    id="historyReviewConsentDialog"
    aria-labelledby="hrc-title"
    aria-describedby="hrc-body"
  >
    <h2 id="hrc-title">Send local history to a remote API service?</h2>
    <p id="hrc-body"></p>
    <div class="dialog-actions">
      <button id="hrc-cancel" type="button" data-variant="secondary">Cancel</button>
      <button id="hrc-continue" type="button" data-variant="primary">Continue</button>
    </div>
  </dialog>

  <script src="/static/network-recovery.js?v=20260815-session-switch" defer></script>
  <script src="/static/clipboard.js?v=20260815-session-switch" defer></script>
  <script src="/static/copy-controller.js?v=20260815-session-switch" defer></script>
  <script src="/static/interaction-mode.js?v=20260815-interaction-mode" defer></script>
  <script src="/static/model-selection.js?v=20260815-session-switch" defer></script>
  <script src="/static/session-profile-switch.js?v=20260914-history-review3" defer></script>
  <script src="/static/history-review.js?v=20260914-history-review3" defer></script>
  <script src="/static/app.js?v=20260914-history-review3" defer></script>
</body>
</html>
